<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Free Autonomous Engineering Setup</title>
  <desc id="desc">Executable Hermes Supervisor Runtime coordinating DeepSeek Harness workers and OmniRoute model routing, with durable state, memory, evidence, deterministic effect gating and human authority.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset="1" stop-color="#07121f"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0d1724"/><stop offset="1" stop-color="#08111c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <g stroke="#132334" stroke-width="1" opacity=".45"><path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600M0 560H1600M0 640H1600M0 720H1600M0 800H1600"/><path d="M100 0V820M200 0V820M300 0V820M400 0V820M500 0V820M600 0V820M700 0V820M800 0V820M900 0V820M1000 0V820M1100 0V820M1200 0V820M1300 0V820M1400 0V820M1500 0V820"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="86" y="88" font-size="54" font-weight="800" fill="#f8fafc">FREE AUTONOMOUS ENGINEERING SETUP</text>
    <text x="88" y="132" font-size="23" fill="#a7b5c7">Executable supervisor core · vendor-neutral worker runtime · cost-aware model routing · evidence-bound authority</text>
    <g font-size="15" font-weight="700"><rect x="88" y="154" width="132" height="34" rx="17" fill="#071b16" stroke="#1f9d71"/><text x="154" y="176" text-anchor="middle" fill="#6ee7b7">LOCAL-FIRST</text><rect x="232" y="154" width="158" height="34" rx="17" fill="#111128" stroke="#6d5bd0"/><text x="311" y="176" text-anchor="middle" fill="#c4b5fd">VENDOR-NEUTRAL</text><rect x="402" y="154" width="176" height="34" rx="17" fill="#11170b" stroke="#718c25"/><text x="490" y="176" text-anchor="middle" fill="#d9f99d">EVIDENCE-DRIVEN</text></g>
    <g>
      <rect x="70" y="250" width="250" height="210" rx="22" fill="url(#panel)" stroke="#2f91ff" stroke-width="2"/><text x="195" y="292" text-anchor="middle" font-size="16" fill="#60a5fa">1 · BOUNDED INTAKE</text><text x="195" y="348" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">Work Order</text><text x="195" y="388" text-anchor="middle" font-size="16" fill="#9fb0c2">Scope · Acceptance criteria</text><text x="195" y="416" text-anchor="middle" font-size="16" fill="#9fb0c2">Risk · Budget · Authority</text>
      <rect x="380" y="222" width="320" height="266" rx="24" fill="#091610" stroke="#34d399" stroke-width="3" filter="url(#glow)"/><text x="540" y="266" text-anchor="middle" font-size="16" fill="#6ee7b7">2 · SUPERVISION PLANE</text><text x="540" y="322" text-anchor="middle" font-size="32" font-weight="800" fill="#d1fae5">HERMES SUPERVISOR</text><text x="540" y="362" text-anchor="middle" font-size="16" fill="#cbd5e1">Canonical state machine</text><text x="540" y="390" text-anchor="middle" font-size="16" fill="#cbd5e1">Dispatch guards · Leases · Recovery</text><text x="540" y="418" text-anchor="middle" font-size="16" fill="#cbd5e1">Provider waits · Idempotency</text><text x="540" y="448" text-anchor="middle" font-size="14" fill="#6ee7b7">EXECUTABLE CORE</text>
      <rect x="760" y="250" width="250" height="210" rx="22" fill="#0c0d18" stroke="#8b5cf6" stroke-width="2"/><text x="885" y="292" text-anchor="middle" font-size="16" fill="#c4b5fd">3 · WORKER RUNTIME</text><text x="885" y="346" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">DeepSeek Harness</text><text x="885" y="388" text-anchor="middle" font-size="16" fill="#9fb0c2">Planner · Builder · Reviewer</text><text x="885" y="416" text-anchor="middle" font-size="16" fill="#9fb0c2">Security reviewer · Tools</text>
      <rect x="1070" y="250" width="250" height="210" rx="22" fill="#07151b" stroke="#22d3ee" stroke-width="2"/><text x="1195" y="292" text-anchor="middle" font-size="16" fill="#67e8f9">4 · ROUTING PLANE</text><text x="1195" y="346" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">OmniRoute</text><text x="1195" y="388" text-anchor="middle" font-size="16" fill="#9fb0c2">Task class · Cost · Health</text><text x="1195" y="416" text-anchor="middle" font-size="16" fill="#9fb0c2">Stickiness · Explicit escalation</text>
      <rect x="1380" y="250" width="150" height="210" rx="22" fill="#16110a" stroke="#f59e0b" stroke-width="2"/><text x="1455" y="292" text-anchor="middle" font-size="16" fill="#fbbf24">5 · QUALITY</text><text x="1455" y="344" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">Verify</text><text x="1455" y="379" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">Review</text><text x="1455" y="414" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">Gate</text>
      <g fill="none" stroke="url(#flow)" stroke-width="5" filter="url(#glow)"><path d="M320 355H380"/><path d="M700 355H760"/><path d="M1010 355H1070"/><path d="M1320 355H1380"/></g>
    </g>
    <g><rect x="70" y="522" width="920" height="154" rx="20" fill="#0b1118" stroke="#334155"/><text x="98" y="557" font-size="16" font-weight="800" fill="#cbd5e1">DURABLE PROJECT STATE + MEMORY FABRIC</text><g font-size="15"><rect x="98" y="582" width="190" height="60" rx="14" fill="#0a1622" stroke="#335a7d"/><text x="193" y="609" text-anchor="middle" fill="#93c5fd">Event Store</text><text x="193" y="630" text-anchor="middle" fill="#94a3b8">Replay · Snapshots</text><rect x="306" y="582" width="190" height="60" rx="14" fill="#11140b" stroke="#687a2d"/><text x="401" y="609" text-anchor="middle" fill="#d9f99d">Memory Fabric</text><text x="401" y="630" text-anchor="middle" fill="#94a3b8">Provenance · Revocation</text><rect x="514" y="582" width="190" height="60" rx="14" fill="#16120a" stroke="#8b6c2d"/><text x="609" y="609" text-anchor="middle" fill="#fde68a">Evidence Ledger</text><text x="609" y="630" text-anchor="middle" fill="#94a3b8">Hashes · Exact outcomes</text><rect x="722" y="582" width="240" height="60" rx="14" fill="#121018" stroke="#5b4d7e"/><text x="842" y="609" text-anchor="middle" fill="#ddd6fe">Deterministic Retrieval</text><text x="842" y="630" text-anchor="middle" fill="#94a3b8">BM25 · Conflicts · Staleness</text></g>
      <rect x="1020" y="522" width="510" height="154" rx="20" fill="#111014" stroke="#7c3aed"/><text x="1048" y="557" font-size="16" font-weight="800" fill="#ddd6fe">ASSURANCE + EFFECT BOUNDARY — SEPARATE</text><g font-size="15"><rect x="1048" y="582" width="138" height="60" rx="14" fill="#15101d" stroke="#7c3aed"/><text x="1117" y="609" text-anchor="middle" fill="#c4b5fd">Assurance</text><text x="1117" y="630" text-anchor="middle" fill="#94a3b8">Exact grants</text><rect x="1202" y="582" width="138" height="60" rx="14" fill="#181008" stroke="#d97706"/><text x="1271" y="609" text-anchor="middle" fill="#fbbf24">Effect Gate</text><text x="1271" y="630" text-anchor="middle" fill="#94a3b8">Fail closed</text><rect x="1356" y="582" width="146" height="60" rx="14" fill="#0d1711" stroke="#16a34a"/><text x="1429" y="609" text-anchor="middle" fill="#86efac">Executor</text><text x="1429" y="630" text-anchor="middle" fill="#94a3b8">One-shot</text></g></g>
    <rect x="70" y="708" width="1460" height="74" rx="18" fill="#080d14" stroke="#25364a"/><text x="94" y="739" font-size="14" font-weight="800" fill="#f8fafc">CANONICAL FLOW</text><text x="235" y="739" font-size="14" fill="#93c5fd">READY</text><text x="292" y="739" fill="#64748b">→</text><text x="316" y="739" font-size="14" fill="#c4b5fd">IN_PROGRESS</text><text x="421" y="739" fill="#64748b">→</text><text x="445" y="739" font-size="14" fill="#fbbf24">READY_FOR_REVIEW</text><text x="592" y="739" fill="#64748b">→</text><text x="616" y="739" font-size="14" fill="#6ee7b7">PASS / CHANGES_REQUESTED</text><text x="826" y="739" fill="#64748b">→</text><text x="850" y="739" font-size="14" fill="#fb7185">FOUNDER_REQUIRED</text><text x="992" y="739" fill="#64748b">→</text><text x="1016" y="739" font-size="14" fill="#6ee7b7">ONE-SHOT ACTION</text><text x="1146" y="739" fill="#64748b">→</text><text x="1170" y="739" font-size="14" fill="#60a5fa">DONE</text><text x="94" y="766" font-size="13" fill="#6ee7b7">Capability ≠ Authority</text><text x="300" y="766" font-size="13" fill="#67e8f9">Evidence before completion</text><text x="540" y="766" font-size="13" fill="#fbbf24">No duplicate dispatch</text><text x="742" y="766" font-size="13" fill="#c4b5fd">Memory ≠ Assurance</text><text x="930" y="766" font-size="13" fill="#fb7185">No self-approval</text><text x="1088" y="766" font-size="13" fill="#9fb0c2">Unknown stays unknown</text><text x="1294" y="766" font-size="13" fill="#9fb0c2">Vendor neutral</text>
  </g>
